<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Gordo, la probabilidad</title>
<meta name="description" content="La probabilidad de que te toque el Gordo, dibujada a una escala que se siente. Spoiler: no.">
<meta name="theme-color" content="#05080F">
<meta property="og:title" content="El Gordo, la probabilidad">
<meta property="og:description" content="La probabilidad de que te toque el Gordo, dibujada a una escala que se siente.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
<script type="module" src="assets/js/film.js"></script>
</head>
<body>
<a class="skip" href="#after" data-k="skip">Saltar al contenido</a>
<canvas id="c" aria-hidden="true"></canvas>
<header class="top">
  <a class="brand" href="./" data-k="brand">El Gordo</a>
  <div class="lang" role="group" aria-label="Idioma"><button type="button" data-lang="es" aria-pressed="true">ES</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
</header>

<main id="film" aria-label="">
  <!-- I · snow -->
  <div class="layer mid" data-a="0" data-b="0.07"><div class="chap" data-k="ch1"></div><div class="kick" style="margin-top:14px" data-k="k1"></div><p class="big" style="margin-top:18px" data-k="a1"></p></div>
  <div class="layer mid" data-a="0.065" data-b="0.125"><p class="big" data-k="a2"></p><p class="aside" data-k="a3"></p></div>
  <!-- II · the drum and your number -->
  <div class="layer high" data-a="0.15" data-b="0.29" data-interactive style="top: 11vh">
    <div class="ticket">
      <div class="chap" data-k="ch2"></div><div class="kick" style="margin-top:12px" data-k="k2"></div><label for="num" class="kick" data-k="you" style="margin-top:10px"></label>
      <input id="num" inputmode="numeric" maxlength="5" autocomplete="off" spellcheck="false" value="00000" aria-describedby="you">
      <button type="button" class="pill" id="random">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3.5c4 0 6.5 10 11 10H21"></path><path d="M3 17h3.5c1.6 0 2.9-1.6 4-3.6"></path><path d="M13.5 10.6c1.1-2 2.4-3.6 4-3.6H21"></path><path d="M18 4l3 3-3 3"></path><path d="M18 14l3 3-3 3"></path></svg>
        <span data-k="random"></span>
      </button>
    </div>
  </div>
  <div class="layer low bare" data-a="0.16" data-b="0.29"><p class="mid-t" data-k="b1"></p></div>
  <!-- III · the camera pulls back -->
  <div class="layer high" data-a="0.30" data-b="0.36" style="top: 15vh"><div class="chap" data-k="ch3"></div></div>
  <div class="layer low" data-a="0.31" data-b="0.39"><p class="big" data-k="c1"></p></div>
  <div class="layer low" data-a="0.41" data-b="0.465"><p class="big" data-k="c2"></p></div>
  <div class="layer low" data-a="0.53" data-b="0.62"><p class="big" data-k="c3"></p><p class="aside" data-k="c4"></p></div>
  <div class="layer" data-a="0.31" data-b="0.62" style="top: 64px; text-align: left"><div class="counter" id="counter"></div></div>
  <!-- IV · stadium of lights -->
  <div class="layer high" data-a="0.64" data-b="0.72"><div class="chap" data-k="ch4"></div><p class="big" style="margin-top:16px" data-k="d1"></p></div>
  <div class="layer low bare" data-a="0.73" data-b="0.81"><p class="big" data-k="d2"></p><p class="aside" data-k="d3"></p></div>
  <!-- V · the punchline -->
  <div class="layer mid" data-a="0.82" data-b="0.89"><div class="chap" style="margin-bottom:22px" data-k="ch5"></div><p class="huge" data-k="e1"></p><p class="mid-t cham" style="margin-top:22px" data-k="e2"></p></div>
  <div class="layer mid" data-a="0.895" data-b="0.985">
    <svg class="flacon" width="150" height="230" viewBox="0 0 150 230" role="img" id="flaconSvg">
      <g fill="none" stroke="#F3E3BF" stroke-width="1.2">
        <rect x="56" y="8" width="38" height="30" rx="2"></rect>
        <line x1="60" y1="16" x2="90" y2="16" opacity="0.5"></line>
        <rect x="66" y="38" width="18" height="12"></rect>
        <path d="M30 70 L50 50 L100 50 L120 70 L120 214 Q120 222 112 222 L38 222 Q30 222 30 214 Z"></path>
        <path d="M38 78 L56 60 L94 60 L112 78" opacity="0.45"></path>
        <rect x="46" y="120" width="58" height="62" opacity="0.9"></rect>
      </g>
      <text x="75" y="142" fill="#F3E3BF" font-family="Spline Sans Mono, monospace" font-size="8" letter-spacing="2.4" text-anchor="middle">N.º</text>
      <text x="75" y="162" fill="#FF7A3D" font-family="Bricolage Grotesque, sans-serif" font-weight="300" font-size="17" text-anchor="middle" id="flaconNum">00000</text>
      <text x="75" y="175" fill="#F3E3BF" font-family="Spline Sans Mono, monospace" font-size="6" letter-spacing="1.6" text-anchor="middle">20 €</text>
    </svg>
    <p class="perfume-name" data-k="p1"></p>
    <div class="perfume-sub" data-k="p2"></div>
    <p class="aside cham" style="margin-top:18px" data-k="p3"></p>
  </div>
</main>
<div class="cue" id="cue"><span data-k="scroll"></span><i></i></div>

<section class="after" id="after">
  <div class="friends" id="friends">
    <div class="stick">
      <div class="wrap fr-wrap">
        <div>
          <div class="chap" data-k="ch6"></div>
          <p class="big fr-title" data-k="g0"></p>
          <div class="fr-steps">
            <p class="fr-step mid-t" data-step="0" data-k="g1"></p>
            <p class="fr-step mid-t" data-step="1" data-k="g2"></p>
            <p class="fr-step mid-t" data-step="2" data-k="g3"></p>
            <p class="fr-step mid-t" data-step="3" data-k="g4"></p>
            <p class="fr-step mid-t" data-step="4" data-k="g5"></p>
            <div class="fr-step" data-step="5">
              <p class="mid-t" data-k="g6"></p>
              <div class="bars" role="img" id="bars">
                <div class="bar"><span data-k="g6a"></span><i style="width:100%"></i><b></b></div>
                <div class="bar back"><span data-k="g6b"></span><i style="width:36%"></i><b></b></div>
              </div>
              <p class="aside" data-k="g7"></p>
            </div>
          </div>
        </div>
        <svg class="people" id="people" viewBox="0 0 300 300" role="img"></svg>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="calm">
      <div data-k="h0"></div>
      <a href="https://www.jugarbien.es/" rel="noopener" data-k="h1"></a> · <span data-k="h2"></span>
    </div>
    <footer class="foot">
      <a href="creditos.html" id="toCred" data-k="cred"></a>
      <a href="https://ko-fi.com/lessane" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"></path><path d="M8 3v2M12 3v2"></path></svg><span data-k="kofi"></span></a>
      <span data-k="priv"></span>
    </footer>
  </div>
</section>
</body>
</html>
